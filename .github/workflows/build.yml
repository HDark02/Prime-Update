name: Build Kivy Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # =========================================================
      # 1. Récupération du projet
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================================
      # 2. Java 17
      # =========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # =========================================================
      # 3. Python
      # =========================================================
      - name: Setup Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      # =========================================================
      # 4. Dépendances système Buildozer
      # =========================================================
      - name: Install system dependencies
        run: |
          sudo apt update

          sudo apt install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            python3-pip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev \
            gettext \
            autopoint

      # =========================================================
      # 5. Installation de Buildozer
      # =========================================================
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --upgrade buildozer

      # =========================================================
      # 6. Installation de Cython
      # =========================================================
      - name: Install Cython
        run: |
          python -m pip install cython==0.29.34

      # =========================================================
      # 7. Cache Buildozer
      # =========================================================
      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      # =========================================================
      # 8. Vérification
      # =========================================================
      - name: Check Buildozer
        run: |
          buildozer --version
          python --version
          java -version

      # =========================================================
      # 9. Nettoyage
      # =========================================================
      - name: Clean Buildozer
        run: |
          buildozer android clean || true

      # =========================================================
      # 10. Construction APK
      # =========================================================
      - name: Build APK
        run: |
          buildozer -v android debug

      # =========================================================
      # 11. Récupération de l'APK
      # =========================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kivy-android-apk
          path: bin/*.apk
          if-no-files-found: error
